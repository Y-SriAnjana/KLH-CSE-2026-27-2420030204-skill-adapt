<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personalized Learning Path - SkillAdapt</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .filter-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .filter-tab {
      padding: 0.5rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .filter-tab:hover {
      background-color: var(--primary-subtle);
      color: var(--primary);
    }
    .filter-tab.active {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div id="sidebar-container"></div>

    <main class="main-content">
      
      <!-- Page Header -->
      <header class="page-header">
        <div>
          <h1 class="page-title">Personalized Learning Path</h1>
          <p class="page-subtitle">Curriculum dynamically prioritized based on your individual quiz performance.</p>
        </div>
      </header>

      <!-- Overall Completion Progress Card -->
      <section class="card" style="margin-bottom: 2rem; background: linear-gradient(135deg, white 0%, var(--primary-subtle) 100%); border: 1.5px solid #bae6fd;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; flex-wrap: wrap; gap: 0.5rem;">
          <div>
            <h2 style="font-size: 1.15rem; font-weight: 700; color: var(--text-main);">Curriculum Completion Status</h2>
            <p id="path-progress-text" style="font-size: 0.9rem; color: var(--text-muted);">
              0 of 0 modules completed (0%)
            </p>
          </div>
          <span class="badge badge-medium" style="font-size: 0.85rem; padding: 0.4rem 0.8rem;">
            Auto-Updated via Quiz Mastery
          </span>
        </div>
        <div class="quiz-progress-bar" style="margin-bottom: 0;">
          <div id="path-progress-bar" class="quiz-progress-fill" style="width: 0%;"></div>
        </div>
      </section>

      <!-- Filter Tabs -->
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">All Modules</button>
        <button class="filter-tab" data-filter="high">High Priority (Needs Improvement)</button>
        <button class="filter-tab" data-filter="medium">Medium Priority (Developing)</button>
        <button class="filter-tab" data-filter="completed">Completed Modules</button>
      </div>

      <!-- Loading State -->
      <div id="learning-loading" style="text-align: center; padding: 3rem;">
        <div style="font-size: 1.1rem; color: var(--text-muted);">
          Assembling your individualized learning path...
        </div>
      </div>

      <!-- Resources List Container -->
      <div id="learning-container" style="display: none;">
        <div id="resources-list"></div>
      </div>

    </main>
  </div>

  <script src="js/app.js"></script>
  <script src="js/learning_path.js"></script>
</body>
</html>
